name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    name: Tests on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=syncdrop --cov-report=term-missing

  no-dependencies:
    name: Runs with nothing installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The claim on the front page is that SyncDrop needs nothing but the standard library.
      # This is the only check that can keep that true: a bare interpreter, no pip install, no
      # virtual environment. The day somebody adds an import of something from PyPI, this job
      # is what notices.
      - name: Run it with no install at all
        run: PYTHONPATH=src python3 -m syncdrop --no-qr

      - name: Draw a QR code with no install at all
        run: PYTHONPATH=src python3 -m syncdrop | tail -5

      - name: Check nothing outside the standard library is imported
        run: |
          python3 - <<'PY'
          import sys

          # What the interpreter already had before SyncDrop was touched. A system Python loads
          # things of its own at startup through sitecustomize, and counting those would make
          # this check fail everywhere for reasons that have nothing to do with SyncDrop.
          before = set(sys.modules)

          sys.path.insert(0, "src")
          import syncdrop.cli
          import syncdrop.network
          import syncdrop.qr.encode
          import syncdrop.qr.render

          stdlib = set(sys.stdlib_module_names)
          pulled_in = sorted(
              {
                  name.split(".")[0]
                  for name in set(sys.modules) - before
                  if not name.startswith(("syncdrop", "_"))
                  and name.split(".")[0] not in stdlib
              }
          )
          if pulled_in:
              raise SystemExit(f"SyncDrop imported from outside the standard library: {pulled_in}")
          print("SyncDrop imports nothing outside the standard library")
          PY
